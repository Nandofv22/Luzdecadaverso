name: Renovar token do Instagram (a cada 30 dias)

on:
  schedule:
    - cron: "0 12 1,16 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Renovar token e atualizar secret
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "Falta o secret GH_PAT (token do GitHub com permissao de escrever secrets neste repo)." >&2
            exit 1
          fi
          resp=$(curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$IG_ACCESS_TOKEN")
          new_token=$(echo "$resp" | python3 -c "import json,sys; print(json.load(sys.stdin).get('access_token',''))")
          if [ -z "$new_token" ]; then
            echo "Falha ao renovar o token: $(echo "$resp" | python3 -c "import json,sys; print(json.load(sys.stdin).get('error',{}).get('message','resposta inesperada'))")" >&2
            exit 1
          fi
          echo "::add-mask::$new_token"
          GH_TOKEN="$GH_PAT" gh secret set IG_ACCESS_TOKEN --repo "$GH_REPO" --body "$new_token"
          echo "Token renovado e secret atualizado."
